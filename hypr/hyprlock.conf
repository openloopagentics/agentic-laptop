general {
    hide_cursor = true
    # NOTE: `grace` is not a config option in hyprlock 0.9.6 — it is CLI-only
    # (`hyprlock --grace N`). It is passed from hypridle's lock_cmd instead.
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/catppuccin-gradient.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

input-field {
    monitor =
    size = 280, 52
    position = 0, -60
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(313244cc)
    font_color  = rgba(cdd6f4ff)
    check_color = rgba(f9e2afff)
    fail_color  = rgba(f38ba8ff)

    placeholder_text = <span foreground="##6c7086">Password</span>
    fail_text = <span foreground="##f38ba8">Wrong ($ATTEMPTS)</span>
    rounding = 10
    fade_on_empty = false
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/macsmc-battery/capacity)%"
    color = rgba(a6e3a1ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -30, -20
    halign = right
    valign = top
}
