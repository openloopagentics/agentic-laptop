# Overrides /usr/share/tiny-dfr/config.toml (the daemon merges both,
# preferring this file).

# false = the primary layer (workspaces, below) shows by default,
# and the media layer is behind Fn.
MediaLayerDefault = false

# Required by builds newer than 0.3.7: the daemon unwraps this from the merged
# config, and the stock /usr/share base config predates the key. Milliseconds
# for a double-press of Fn to swap the default layer; 0 disables.
DoublePressSwitchLayers = 250

# Default layer: the six named Hyprland workspaces.
# Each button sends the same combo as the keyboard bind, so Hyprland
# handles it identically.
PrimaryLayerKeys = [
    { Text = "alpha",  Action = [ "LeftMeta", "LeftShift", "O" ] , Color = "blue", Badge = "alpha" },
    { Text = "beta",   Action = [ "LeftMeta", "LeftShift", "V" ] , Color = "mauve", Badge = "beta" },
    { Text = "gamma",   Action = [ "LeftMeta", "LeftShift", "D" ] , Color = "peach", Badge = "gamma" },
    { Text = "delta", Action = [ "LeftMeta", "LeftShift", "S" ] , Color = "green", Badge = "delta" },
    { Text = "epsilon",   Action = [ "LeftMeta", "LeftShift", "H" ] , Color = "red", Badge = "epsilon" },
    { Text = "zeta",  Action = [ "LeftMeta", "LeftShift", "L" ] , Color = "teal", Badge = "zeta" },
    { Text = "eta",  Action = [ "LeftMeta", "LeftShift", "C" ] , Color = "yellow", Badge = "eta" },
    # Commits you authored across one host's repos: today, this week, this
    # month, written by `gitcommits` on a timer. Tapping it sends SUPER+SHIFT+G,
    # which the Hyprland config binds to the by-hour overlay.
    { Widget = "commits", Source = "file", Path = "/var/lib/claude-limits/commits.toml", Action = [ "LeftMeta", "LeftShift", "G" ] },
    # SUPER+R toggles the clickable F1-F12 overlay on the main screen.
    # Usage rings: 5-hourly / weekly-all / weekly-Fable, outermost first.
    # The daemon runs as `nobody`, so figures arrive via a world-readable file
    # written by `climits --toml`, not by reading ~/.claude.json directly.
    # Each tap sends its own combo, so Hyprland opens the detail overlay on
    # that account. To draw a provider mark above the tag, put an SVG at
    # /etc/tiny-dfr/<name>.svg and add Logo = "<name>"; none ship with this repo.
    { Widget = "bars", Source = "file", Path = "/var/lib/claude-limits/limits.toml", Account = "you@example.com", Action = [ "LeftMeta", "LeftShift", "U" ], Text = "c1" },
    { Widget = "bars", Source = "file", Path = "/var/lib/claude-limits/limits.toml", Account = "other@example.com", Action = [ "LeftMeta", "LeftShift", "I" ], Text = "c2" },
    { Widget = "bars", Source = "file", Path = "/var/lib/claude-limits/limits.toml", Account = "codex", Action = [ "LeftMeta", "LeftShift", "M" ], Text = "cx" }
]

# Named colours, referenced by the Color/Background/ActiveBackground keys above.
# Catppuccin Mocha, matching waybar and the F-key overlay.

# The Fn layer, copied from the base config so the F1-12 switch can be added.
MediaLayerKeys = [
    { Icon = "brightness_low", Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp" },
    { Icon = "mic_off", Action = "MicMute" },
    { Icon = "search", Action = "Search" },
    { Icon = "backlight_low", Action = "IllumDown" },
    { Icon = "backlight_high", Action = "IllumUp" },
    { Icon = "fast_rewind", Action = "PreviousSong" },
    { Icon = "play_pause", Action = "PlayPause" },
    { Icon = "fast_forward", Action = "NextSong" },
    { Icon = "volume_off", Action = "Mute" },
    { Icon = "volume_down", Action = "VolumeDown" },
    { Icon = "volume_up", Action = "VolumeUp" },
    { Text = "F1-12", Layer = "fkeys", Color = "peach" }
]

# Attention badges, written by claude-badged from remote Claude hooks.
BadgeFile = "/var/lib/claude-limits/badges.toml"

# Seconds of inactivity before the strip dims, then goes dark.
# Honoured to ~10s granularity: the daemon only wakes that often when idle.
DimTimeoutSec = 30
OffTimeoutSec = 60

[Palette]
blue    = "#89b4fa"
mauve   = "#cba6f7"
peach   = "#fab387"
green   = "#a6e3a1"
red     = "#f38ba8"
teal    = "#94e2d5"
yellow  = "#f9e2af"
surface = "#45475a"

# A third layer, reachable only from that button. Layers 0 and 1 keep the Fn
# semantics; extras are switched to by a button carrying a Layer key.
[ExtraLayers]
fkeys = [
    { Text = "F1", Action = "F1" },
    { Text = "F2", Action = "F2" },
    { Text = "F3", Action = "F3" },
    { Text = "F4", Action = "F4" },
    { Text = "F5", Action = "F5" },
    { Text = "F6", Action = "F6" },
    { Text = "F7", Action = "F7" },
    { Text = "F8", Action = "F8" },
    { Text = "F9", Action = "F9" },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12" },
    { Text = "back", Layer = "primary", Color = "peach" }
]
